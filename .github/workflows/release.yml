name: Build and release SteamyLAN

on:
  push:
    branches:
      - main
    paths:
      - 'SteamyLan/*.py'
      - 'SteamyLan/**/*.py'
      - 'run.py'
      - 'tools/update_helper.py'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'pyproject.toml'
      - 'steam_api64.dll'
      - 'third_party/windivert/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: steamylan-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Push events are already limited to program/runtime changes on main.
    # workflow_dispatch is kept as a manual recovery/rebuild option.
    runs-on: windows-latest

    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve official Steamworks DLL
        shell: pwsh
        env:
          STEAM_API64_DLL_B64: ${{ secrets.STEAM_API64_DLL_B64 }}
        run: |
          if (Test-Path "steam_api64.dll") {
            Write-Host "Using steam_api64.dll checked into the repository."
            exit 0
          }

          if (-not [string]::IsNullOrWhiteSpace($env:STEAM_API64_DLL_B64)) {
            $bytes = [Convert]::FromBase64String($env:STEAM_API64_DLL_B64)
            [IO.File]::WriteAllBytes((Join-Path $PWD "steam_api64.dll"), $bytes)
            Write-Host "Restored steam_api64.dll from STEAM_API64_DLL_B64."
            exit 0
          }

          throw @"
          steam_api64.dll is required to build SteamyLAN.

          Either:
          1. Track the official 64-bit Steamworks steam_api64.dll in this repository, or
          2. Add repository secret STEAM_API64_DLL_B64 containing the base64-encoded DLL.
          "@

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Resolve and stamp release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $threePartTag = '^v\d+\.\d+\.\d+$'

          $currentTag = git tag --points-at "$env:GITHUB_SHA" |
            Where-Object { $_ -match $threePartTag } |
            Select-Object -First 1

          if ($currentTag) {
            Write-Host "Reusing $currentTag because this commit already has a release."
            $version = python tools/stamp_build_version.py --reuse-version "$currentTag"
          }
          else {
            $releaseTags = @(
              gh release list --limit 100 --json tagName --jq '.[].tagName' |
                Where-Object { $_ -match $threePartTag }
            )

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            # Start the current release sequence from v1.0.0.
            # Legacy tags are ignored until v1.0.0 exists.
            gh release view 'v1.0.0' --json tagName *> $null
            $resetPublished = $LASTEXITCODE -eq 0

            $previousTag = if ($resetPublished) {
              $releaseTags | Select-Object -First 1
            }
            else {
              $null
            }

            if ($previousTag) {
              $version = python tools/stamp_build_version.py --previous-version "$previousTag"
            }
            else {
              $version = python tools/stamp_build_version.py
            }
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $version = $version.Trim()

          "version=$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          "tag=v$version" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

          Write-Host "Building SteamyLAN $version"

      - name: Build Windows application
        shell: pwsh
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            build, dist, release `
            -ErrorAction SilentlyContinue

          Write-Host "Building SteamyLAN..."

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name SteamyLAN `
            --icon "SteamyLan\steamylan.ico" `
            --add-data "SteamyLan\steamylan.ico:SteamyLan" `
            --add-data "SteamyLan\steamylan.png:SteamyLan" `
            --add-data "third_party\windivert\LICENSE.txt:third_party\windivert" `
            --add-data "third_party\windivert\NOTICE.md:third_party\windivert" `
            --add-data "third_party\windivert\x64\WinDivert64.sys:." `
            --add-binary "steam_api64.dll:." `
            --add-binary "third_party\windivert\x64\WinDivert.dll:." `
            run.py

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "dist\SteamyLAN\SteamyLAN.exe")) {
            throw "PyInstaller completed without creating dist\SteamyLAN\SteamyLAN.exe"
          }

          # Keep WinDivert runtime files directly beside SteamyLAN.exe.
          Copy-Item `
            "third_party\windivert\x64\WinDivert.dll" `
            "dist\SteamyLAN\WinDivert.dll" `
            -Force

          Copy-Item `
            "third_party\windivert\x64\WinDivert64.sys" `
            "dist\SteamyLAN\WinDivert64.sys" `
            -Force

          if (
            -not (Test-Path "dist\SteamyLAN\WinDivert.dll") -or
            -not (Test-Path "dist\SteamyLAN\WinDivert64.sys")
          ) {
            throw "PyInstaller completed without the WinDivert runtime"
          }

          Write-Host "Building SteamyLAN updater..."

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SteamyLANUpdate `
            tools\update_helper.py

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "dist\SteamyLANUpdate.exe")) {
            throw "PyInstaller did not create SteamyLANUpdate.exe"
          }

          Copy-Item `
            "dist\SteamyLANUpdate.exe" `
            "dist\SteamyLAN\SteamyLANUpdate.exe" `
            -Force

          # Keep the official Steam DLL directly beside the EXE.
          Copy-Item `
            "steam_api64.dll" `
            "dist\SteamyLAN\steam_api64.dll" `
            -Force

          Write-Host "Build completed."

          Get-ChildItem "dist\SteamyLAN" |
            Format-Table Name, Length

      - name: Create versioned ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $asset = "release\SteamyLAN_v$version.zip"

          # No trimming or package_release.py processing.
          # Package the complete PyInstaller output exactly as built.
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release" |
            Out-Null

          if (-not (Test-Path "dist\SteamyLAN\SteamyLAN.exe")) {
            throw "Build folder is missing SteamyLAN.exe"
          }

          if (-not (Test-Path "dist\SteamyLAN\steam_api64.dll")) {
            throw "Build folder is missing steam_api64.dll"
          }

          if (-not (Test-Path "dist\SteamyLAN\SteamyLANUpdate.exe")) {
            throw "Build folder is missing SteamyLANUpdate.exe"
          }

          if (
            -not (Test-Path "dist\SteamyLAN\WinDivert.dll") -or
            -not (Test-Path "dist\SteamyLAN\WinDivert64.sys")
          ) {
            throw "Build folder is missing the WinDivert runtime"
          }

          Write-Host "Creating $asset from the complete PyInstaller build..."

          Compress-Archive `
            -Path "dist\SteamyLAN\*" `
            -DestinationPath $asset `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $asset)) {
            throw "Release ZIP was not created: $asset"
          }

          $zipInfo = Get-Item $asset

          Write-Host "Created release archive:"
          Write-Host "  $($zipInfo.FullName)"
          Write-Host "  Size: $($zipInfo.Length) bytes"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $title = "SteamyLAN $env:RELEASE_VERSION"
          $asset = "release\SteamyLAN_v$env:RELEASE_VERSION.zip"
          $checksum = "$asset.sha256"

          if (-not (Test-Path $asset)) {
            throw "Release asset does not exist: $asset"
          }

          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          $fileName = Split-Path $asset -Leaf

          "$hash  $fileName" |
            Set-Content `
              $checksum `
              -NoNewline

          Write-Host "Release asset:"
          Write-Host "  $asset"
          Write-Host "SHA256:"
          Write-Host "  $hash"

          # Re-running the same Actions run keeps the same run number/tag.
          # Replace the existing assets instead of creating duplicates.
          gh release view "$env:RELEASE_TAG" *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists."
            Write-Host "Replacing existing release assets."

            gh release upload `
              "$env:RELEASE_TAG" `
              "$asset" `
              "$checksum" `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          else {
            Write-Host "Creating release $env:RELEASE_TAG."

            gh release create `
              "$env:RELEASE_TAG" `
              "$asset" `
              "$checksum" `
              --target "$env:GITHUB_SHA" `
              --title "$title" `
              --generate-notes `
              --latest

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Write-Host "Published SteamyLAN $env:RELEASE_VERSION successfully."