[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "steamylan"
version = "1.0.0"
description = "Simple Steam-based sharing for local game servers"
requires-python = ">=3.14.7,<3.15"
dependencies = [
  "PySide6==6.11.1",
  "psutil>=7.0,<8",
  "platformdirs>=4.3,<5",
  "vdf>=3.4,<4",
  "cryptography>=46,<47",
  "pywin32>=310; platform_system == 'Windows'",
]

[project.scripts]
steamylan = "SteamyLan.app:main"

[tool.setuptools.packages.find]
include = ["SteamyLan*"]

[tool.setuptools.package-data]
SteamyLan = ["steamylan.ico", "steamylan.png"]
